[tools]
go = "1.27.2"
argocd = {
    version = "3.5.4",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && argocd completion zsh > ${HOME}/.local/share/zsh/completions/_argocd"
}
gh = {
    version = "2.102.0",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && gh completion -s zsh > ${HOME}/.local/share/zsh/completions/_gh"
}
lfk = {
    version = "v0.19.3",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && lfk completion zsh > ${HOME}/.local/share/zsh/completions/_lfk"
}
atuin = {
    version = "18.23.0",
    postinstall = '''
        mkdir -p ${HOME}/.local/share/zsh/completions && \
        atuin gen-completions --shell zsh > ${HOME}/.local/share/zsh/completions/_atuin && \
        (grep -qF 'eval "$(atuin init zsh)"' ${HOME}/.zshrc || printf '%s\n' 'eval "$(atuin init zsh)"' >> ${HOME}/.zshrc)
    '''
}
kubectl = {
    version = "1.37.1",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && kubectl completion zsh > ${HOME}/.local/share/zsh/completions/_kubectl"
}
clusterctl = {
    version = "1.14.3",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && clusterctl completion zsh > ${HOME}/.local/share/zsh/completions/_clusterctl"
}
awscli = "2.37.11"
yq = {
    version = "4.54.1",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && yq completion zsh > ${HOME}/.local/share/zsh/completions/_yq"
}
gcloud = "588.0.0"
azure-cli = "2.91.0"
pipx = "1.17.12"
pytest = "9.1.1"
python = "3.14.8"
krew = "v0.5.0"
uv = "0.12.23" # required by the azure-cli
helm = {
    version = "4.3.0",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && helm completion zsh > ${HOME}/.local/share/zsh/completions/_helm"
}
direnv = "2.38.1"
kind = {
    version = "0.33.0",
    postinstall = "mkdir -p ${HOME}/.local/share/zsh/completions && kind completion zsh > ${HOME}/.local/share/zsh/completions/_kind"
}
claude = {
    version = "2.1.295",
    minimum_release_age = "0s"
}

[tool_alias]
lfk = "github:janosmiko/lfk"
pytest = "pipx:pytest"
