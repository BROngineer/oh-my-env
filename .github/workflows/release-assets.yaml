on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

name: release-assets

jobs:
  upload-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build configs tarball
        run: tar -czf oh-my-env-configs.tar.gz configs
      - name: upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" oh-my-env-configs.tar.gz --clobber
