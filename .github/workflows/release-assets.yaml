on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

name: release-assets

jobs:
  upload-configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: build configs tarball
        run: tar -czf oh-my-env-configs.tar.gz configs
      - name: upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" oh-my-env-configs.tar.gz --clobber
