on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

name: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@7b402fe76b7bc4273576663a09be2f0f85266e2f # v47.0.0
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
