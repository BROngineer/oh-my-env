on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

name: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
