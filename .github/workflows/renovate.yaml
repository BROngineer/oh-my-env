on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

name: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
