on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

name: renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
        env:
          RENOVATE_GITHUB_COM_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
